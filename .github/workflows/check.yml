name: Validate, build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - name: Generated files must match sources
        run: git diff --exit-code -- index.html data/cards.csv docs/cards.md data/enemies.json docs/enemies10.md
